name: Build Cartographer

on: [push, pull_request]

permissions:
  contents: read

jobs:
  fetch-setup-dxsdk2010:
    runs-on: windows-2022
    outputs:
      dxsdk-path: ${{steps.dxsdk-set-path.outputs.DXSDK_DIR}}

    steps:
      - name: Restore DXSDK from cache
        id: cache-dxsdk
        uses: actions/cache@v4
        with:
          path: D:\depends\DXSDK
          key: dxsdk-june2010

      - name: Download DirectX SDK (June 2010)
        if: steps.cache-dxsdk.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe"
          $destSdkExec = "$env:RUNNER_TEMP\DXSDK_Jun10.exe"
          $extractPath = "D:\depends\DXSDK"
          Write-Host "Downloading DirectX SDK from $url ..."
          Start-BitsTransfer -Source $url -Destination $destSdkExec -DisplayName "DXSDK_Jun10" -Description "Downloading DXSDK" -TransferType Download
          Write-Host "Download complete. Extracting..."
          Write-Host "Extracting DirectX SDK silently using 7-Zip..."
          & 7z x $destSdkExec DXSDK/Include DXSDK/Lib -oD:\depends\

      - name: Set DXSDK_DIR environment variable
        id: dxsdk-set-path
        run: |
          echo 'DXSDK_DIR=D:\depends\DXSDK' >> $env:GITHUB_OUTPUT
          Get-Content $env:GITHUB_OUTPUT

  build-win:
    needs: fetch-setup-dxsdk2010
    runs-on: windows-2022

    env:
      SOLUTION_FILE_PATH: .
      PLATFORM: x86
    strategy:
      matrix:
        # Use this when we fix llvm builds
        #BUILD_CONFIGURATION: [debug_msvc, debug_llvm, release_msvc, release_llvm]
        BUILD_CONFIGURATION: [debug_msvc, release_msvc, release_min_msvc]

    steps:
    - uses: actions/checkout@v4.1.6

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore DXSDK from cache
      id: cache-dxsdk
      uses: actions/cache@v4
      with:
        path: ${{needs.fetch-setup-dxsdk2010.outputs.dxsdk-path}}
        key: dxsdk-june2010

    - name: Verify DXSDK installation
      run: |
        echo "DXSDK_DIR is ${{needs.fetch-setup-dxsdk2010.outputs.dxsdk-path}}"
        dir ${{needs.fetch-setup-dxsdk2010.outputs.dxsdk-path}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{matrix.BUILD_CONFIGURATION}} /p:Platform=${{env.PLATFORM}} ${{matrix.SOLUTION_FILE_PATH}} /p:DXSDK_DIR=${{needs.fetch-setup-dxsdk2010.outputs.dxsdk-path}}/
      
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4.5.0
      with:
        name: xlive ${{matrix.BUILD_CONFIGURATION}}
        path: |
            ./Halo2/xlive.dll
            ./Halo2/xlive.map
            ./xlive/objects/${{matrix.BUILD_CONFIGURATION}}/xlive.pdb